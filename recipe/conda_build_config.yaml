# Build mujoco against both libabseil 20260107 and 20260526.
# jaxlib is still built against libabseil 20260107.1 (see
# https://github.com/conda-forge/jaxlib-feedstock/pull/357), so the old variant keeps
# mujoco-mjx installable together with jaxlib, while the new variant lets mujoco be
# installed in environments that already use libabseil 20260526.
# Drop this file once jaxlib is rebuilt for libabseil 20260526.
libabseil:
  - "20260107"
  - "20260526"
